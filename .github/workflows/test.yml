name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - if: runner.os != 'Windows'
        run: ./mvnw -B -f backend/pom.xml clean package
      - if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -f backend\pom.xml clean package
      - run: python3 scripts/smoke.py
